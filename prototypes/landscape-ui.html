<style>

<div id="amber-dungeon-ui" class="viz-dotted-background">
  <style>
    #amber-dungeon-ui{color-scheme:dark;--ad-bg:#0c121d;--ad-panel:#172332;--ad-panel-2:#202e3d;--ad-ink:#e8eef3;--ad-sub:#a9b7c5;--ad-line:#3a4b5d;--ad-amber:#f4bf66;--ad-amber-bg:#654921;--ad-tile:#273749;--ad-tile-alt:#293a4b;--ad-edge:#172330;--ad-stone:#66788b;--ad-stone-dark:#354456;--ad-stone-light:#8e9eac;--ad-green:#84b78b;--ad-red:#df8e84;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ad-ink);padding:12px 0;box-sizing:border-box}
    #amber-dungeon-ui *{box-sizing:border-box}
    #amber-dungeon-ui{--ad-blue:#81acd4;--ad-brown:#a68155}
    #amber-dungeon-ui [hidden]{display:none!important}
    #amber-dungeon-ui button{font:inherit;min-height:44px;color:var(--ad-ink);background:var(--ad-panel);border:1px solid var(--ad-line);border-radius:9px;padding:8px 12px;font-size:13px;font-weight:500;touch-action:manipulation}
    #amber-dungeon-ui button:disabled{opacity:.45}
    #amber-dungeon-ui button[aria-pressed="true"],#amber-dungeon-ui .ad-primary{color:var(--ad-ink);background:var(--ad-amber-bg);border-color:var(--ad-amber)}
    #amber-dungeon-ui .ad-device{position:relative;width:100%;max-width:900px;margin:0 auto;border:1px solid var(--ad-line);border-radius:19px;background:var(--ad-bg);box-shadow:0 16px 36px #00000050;overflow:hidden}
    #amber-dungeon-ui .ad-top{position:absolute;left:12px;right:12px;top:10px;z-index:4;display:flex;align-items:flex-start;justify-content:space-between;gap:10px;pointer-events:none}
    #amber-dungeon-ui .ad-resources{display:flex;gap:6px;align-items:center;flex-shrink:0}
    #amber-dungeon-ui .ad-resource{display:flex;gap:5px;align-items:center;font-size:12px;font-variant-numeric:tabular-nums;white-space:nowrap;background:var(--ad-panel-2);border-radius:7px;padding:6px 8px}
    #amber-dungeon-ui .ad-resource b{font-weight:500;font-size:13px}
    #amber-dungeon-ui .ad-main{position:relative}
    #amber-dungeon-ui .ad-map-wrap{height:376px;position:relative;background:var(--ad-bg)}
    #amber-dungeon-ui .ad-map-input{position:absolute;inset:0;border:0;border-radius:0;background:transparent;padding:0;width:100%;height:100%;overflow:hidden;touch-action:none;cursor:grab}
    #amber-dungeon-ui .ad-map-input:active{cursor:grabbing}
    #amber-dungeon-ui canvas{width:100%;height:100%;display:block}
    #amber-dungeon-ui .ad-sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap;border:0}
    #amber-dungeon-ui .ad-shortcuts{position:absolute;right:12px;top:67px;display:grid;gap:7px}
    #amber-dungeon-ui .ad-shortcuts button{min-width:74px;background:var(--ad-panel)}
    #amber-dungeon-ui .ad-main>[data-mode]{position:absolute;bottom:12px;z-index:3;min-width:100px;box-shadow:0 3px 10px #00000018}
    #amber-dungeon-ui .ad-main>[data-mode="mine"]{left:12px}
    #amber-dungeon-ui .ad-main>[data-mode="build"]{right:12px}
    #amber-dungeon-ui .ad-buildbar,#amber-dungeon-ui .ad-upgrade-panel{position:absolute;right:12px;bottom:66px;width:248px;max-width:calc(100% - 24px);z-index:3;padding:8px;display:grid;gap:6px;background:var(--ad-panel-2);border:1px solid var(--ad-line);border-radius:12px;box-shadow:0 6px 18px #00000020}
    #amber-dungeon-ui .ad-buildbar{width:264px}
    #amber-dungeon-ui .ad-buildbar .ad-categories{display:flex;gap:5px}
    #amber-dungeon-ui .ad-buildbar button{flex:1;min-width:0;padding:7px 8px}
    #amber-dungeon-ui .ad-buildbar .ad-confirm{display:flex;gap:5px}
    #amber-dungeon-ui .ad-upgrade-panel strong{font-size:14px;font-weight:500}
    #amber-dungeon-ui .ad-upgrade-panel p{font-size:12px;line-height:1.4;margin:0;color:var(--ad-sub)}
    #amber-dungeon-ui .ad-upgrade-actions{display:flex;gap:5px}
    #amber-dungeon-ui .ad-upgrade-actions button{flex:1;min-width:0;padding:7px 8px}
    #amber-dungeon-ui .ad-cost{font-size:11px;color:var(--ad-sub);padding:0 3px}
    #amber-dungeon-ui .ad-status{min-width:0;max-width:50%;font-size:12px;color:var(--ad-sub);line-height:1.4;background:var(--ad-panel);padding:6px 9px;border-radius:7px}
    #amber-dungeon-ui .ad-screen{background:var(--ad-bg);padding:66px 12px 12px;min-height:376px}
    #amber-dungeon-ui .ad-screen-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
    #amber-dungeon-ui .ad-screen-head h2{margin:0;font-size:17px;font-weight:500}
    #amber-dungeon-ui .ad-screen-head span{font-size:12px;color:var(--ad-sub)}
    #amber-dungeon-ui .ad-options{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
    #amber-dungeon-ui .ad-option{padding:14px;background:var(--ad-panel);border-radius:11px;min-width:0;display:flex;flex-direction:column;gap:10px}
    #amber-dungeon-ui .ad-option h3{font-size:15px;font-weight:500;margin:0}
    #amber-dungeon-ui .ad-option p{font-size:13px;line-height:1.5;margin:0;color:var(--ad-sub)}
    #amber-dungeon-ui .ad-option .ad-symbol{height:37px;color:var(--ad-amber);display:flex;align-items:center;gap:9px}
    #amber-dungeon-ui .ad-option button{margin-top:auto;width:100%}
    #amber-dungeon-ui .ad-option .ad-symbol span{font-size:12px;color:var(--ad-sub)}
    #amber-dungeon-ui .ad-weapon-tabs{display:flex;gap:6px;margin-left:auto}
    #amber-dungeon-ui .ad-weapon-tabs button{min-width:58px}
    @media(max-width:520px){
      #amber-dungeon-ui .ad-top{left:8px;right:8px;top:8px;gap:5px}
      #amber-dungeon-ui .ad-resources{gap:4px}
      #amber-dungeon-ui .ad-resource{font-size:11px;padding:5px;gap:3px}
      #amber-dungeon-ui .ad-resource b{font-size:12px}
      #amber-dungeon-ui .ad-map-wrap{height:440px}
      #amber-dungeon-ui .ad-shortcuts{right:8px;top:84px;gap:5px}
      #amber-dungeon-ui .ad-shortcuts button{min-width:62px;font-size:12px;padding:6px}
      #amber-dungeon-ui .ad-status{font-size:11px;padding:5px 6px;flex:1;max-width:none;overflow-wrap:anywhere}
      #amber-dungeon-ui .ad-buildbar,#amber-dungeon-ui .ad-upgrade-panel{right:8px;max-width:calc(100% - 16px)}
      #amber-dungeon-ui .ad-main>[data-mode="mine"]{left:8px}
      #amber-dungeon-ui .ad-main>[data-mode="build"]{right:8px}
      #amber-dungeon-ui .ad-screen-head{flex-wrap:wrap}
      #amber-dungeon-ui .ad-screen-head h2{font-size:15px}
      #amber-dungeon-ui .ad-options{grid-template-columns:1fr}
      #amber-dungeon-ui .ad-screen{padding:88px 10px 10px;min-height:440px}
      #amber-dungeon-ui .ad-weapon-tabs{width:100%;margin-left:0}
      #amber-dungeon-ui .ad-weapon-tabs button{flex:1}
    }
  </style>
  <div class="ad-device">
    <header class="ad-top">
      <div class="ad-resources" aria-label="保有資源">
        <span class="ad-resource">魔力 <b data-mana>20/70</b></span>
        <span class="ad-resource">資材 <b data-materials>80</b></span>
        <span class="ad-resource">資金 <b data-funds>40</b></span>
      </div>
      <span class="ad-status" data-status aria-live="polite">準備中</span>
    </header>
    <section class="ad-main" data-screen="main" aria-label="拠点のメイン画面">
      <div class="ad-map-wrap">
          <button type="button" class="ad-map-input" aria-label="拠点の盤面。通常は矢印キーで移動、EnterまたはSpaceで施設を順に選択。Shift併用で逆順、Escapeで選択解除。選択後はTabで強化ボタンへ進めます。掘削・配置中は矢印キーで候補を選び、掘削はEnter、施設は配置するボタンで決定。">
          <canvas aria-label="四角形のマスを斜めから見たLv1の拠点。施設の選択と自由配置、コボルドによる採掘を操作できます。">地下拠点の配置図</canvas>
        </button>
        <span class="ad-sr-only" data-inspection-status aria-live="polite"></span>
        <nav class="ad-shortcuts" aria-label="管理画面">
          <button type="button" class="cursor-interaction" data-go="research">研究</button>
          <button type="button" class="cursor-interaction" data-go="weapons">武器・防具</button>
          <button type="button" class="cursor-interaction" data-raid>模擬襲撃</button>
        </nav>
      </div>
      <div class="ad-buildbar" data-buildbar hidden>
        <div class="ad-categories" aria-label="配置するもの">
          <button type="button" class="cursor-interaction" data-kind="wall" aria-pressed="true">防壁</button>
          <button type="button" class="cursor-interaction" data-kind="archer" aria-pressed="false">弓塔</button>
          <button type="button" class="cursor-interaction" data-kind="mage" aria-pressed="false">魔法塔</button>

        </div>
        <span class="ad-cost" data-cost></span>
        <div class="ad-confirm">
          <button type="button" class="cursor-interaction" data-cancel>取消</button>
          <button type="button" class="ad-primary cursor-interaction" data-confirm disabled>配置する</button>
        </div>
      </div>
      <section class="ad-upgrade-panel" data-upgrade-panel aria-label="選択した施設の強化" hidden>
        <strong data-facility-name></strong>
        <p data-facility-stats></p>
        <span class="ad-cost" data-upgrade-cost></span>
        <div class="ad-upgrade-actions">
          <button type="button" class="cursor-interaction" data-clear-selection>選択解除</button>
          <button type="button" class="ad-primary cursor-interaction" data-upgrade disabled>強化する</button>
          <button type="button" class="ad-primary cursor-interaction" data-well-research hidden>研究へ</button>
        </div>
      </section>
      <button type="button" class="cursor-interaction" data-mode="mine" aria-pressed="false">掘削</button>
      <button type="button" class="ad-primary cursor-interaction" data-mode="build" aria-pressed="false">施設配置</button>
    </section>
    <section class="ad-screen" data-screen="research" aria-label="研究画面" hidden>
      <div class="ad-screen-head">
        <button type="button" class="cursor-interaction" data-go="main">← 拠点へ</button>
        <h2>研究</h2><span>魔王</span>
      </div>
      <div class="ad-options">
        <article class="ad-option">
          <div class="ad-symbol"><svg class="ad-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"></path><path d="M3 18a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h5a4 4 0 0 1 4 4 4 4 0 0 1 4-4h5a1 1 0 0 1 1 1v13a1 1 0 0 1-1 1h-6a3 3 0 0 0-3 3 3 3 0 0 0-3-3z"></path></svg><span>魔力の汲み上げ</span></div>
          <h3 data-research-title="extraction">汲み上げ効率 Lv0 → Lv1</h3>
          <p data-research-effect="extraction">6 → 7.2 / 時間</p>
          <span class="ad-cost" data-research-cost="extraction"></span>
          <button type="button" class="cursor-interaction" data-research="extraction">研究する</button>
        </article>
        <article class="ad-option">
          <div class="ad-symbol"><svg class="ad-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path></svg><span>魔力の蓄積</span></div>
          <h3 data-research-title="storage">魔力貯蔵 Lv0 → Lv1</h3>
          <p data-research-effect="storage">上限 70 → 84</p>
          <span class="ad-cost" data-research-cost="storage"></span>
          <button type="button" class="cursor-interaction" data-research="storage">研究する</button>
        </article>
      </div>
    </section>
    <section class="ad-screen" data-screen="weapons" aria-label="武器防具画面" hidden>
      <div class="ad-screen-head">
        <button type="button" class="cursor-interaction" data-go="main">← 拠点へ</button>
        <h2>武器・防具</h2><span>ドワーフ</span>
        <div class="ad-weapon-tabs" aria-label="工房の仕事">
          <button type="button" class="cursor-interaction" data-work="craft" aria-pressed="true">製造</button>
          <button type="button" class="cursor-interaction" data-work="upgrade" aria-pressed="false">改良</button>
        </div>
      </div>
      <div class="ad-options">
        <article class="ad-option">
          <div class="ad-symbol"><svg class="ad-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m11 19-6-6"></path><path d="m5 21-2-2"></path><path d="m8 16-4 4"></path><path d="M9.5 17.5 21 6V3h-3L6.5 14.5"></path></svg><span>武器</span></div>
          <h3 data-item-name="sword">鉄の剣</h3><p data-item-detail="sword">配下の近接攻撃用。</p>
          <button type="button" class="cursor-interaction" data-weapon="鉄の剣">製造を指示</button>
        </article>
        <article class="ad-option">
          <div class="ad-symbol"><svg class="ad-icon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"></path><path d="M12 22V2"></path></svg><span>防具</span></div>
          <h3 data-item-name="armor">鉄の鎧</h3><p data-item-detail="armor">前衛の防御用。</p>
          <button type="button" class="cursor-interaction" data-weapon="鉄の鎧">製造を指示</button>
        </article>
      </div>
    </section>
  </div>
  <script>
  (() => {
    const root = document.getElementById('amber-dungeon-ui');
    const q = s => root.querySelector(s);
    const qa = s => [...root.querySelectorAll(s)];
    const canvas = q('canvas');
    const ctx = canvas.getContext('2d');
    const mapButton = q('.ad-map-input');
    const wrap = q('.ad-map-wrap');
    // Lv1 mana rate/cap are specified. Research bonuses/costs and other values are provisional.
    const CONFIG = {dungeonLevel:1,baseManaHourly:6,baseManaCap:70,researchBonus:.2,maxResearchLevel:1,initialResources:{mana:20,materials:80,funds:40},miningSeconds:8,miningYield:20,maxFacilityLevel:2};
    const SAVE_VERSION=1,STORAGE_KEY='amber-dungeon-prototype:save:v1';
    const RESEARCH={extraction:{name:'汲み上げ効率'},storage:{name:'魔力貯蔵'}};
    const names = {well:'魔力井',archer:'エルフ弓塔',mage:'魔法塔',wall:'防壁',trap:'罠'};
    const resourceNames = {mana:'魔力',materials:'資材',funds:'資金'};
    const COSTS = {
      build:{wall:{materials:10},archer:{materials:30,funds:15},mage:{materials:25,mana:20},trap:{materials:15,funds:5}},
      upgrade:{archer:{materials:30,funds:10},mage:{materials:30,mana:25},wall:{materials:20},trap:{materials:20,funds:5}},
      research:{extraction:{mana:10,funds:10},storage:{materials:20,mana:10}}
    };
    const TOWER_POWER = {archer:{1:10,2:15},mage:{1:20,2:30}};
    const state = {dungeonLevel:CONFIG.dungeonLevel,resources:{...CONFIG.initialResources},research:{extraction:0,storage:0},manaUpdatedAt:Date.now(),screen:'main',mode:'inspect',kind:'wall',preview:null,infoTarget:null,infoSource:null,nextStructureId:5,zoom:1,panX:0,panY:0,work:'craft',orders:0,mineIndex:0,mining:{active:null,queue:[],completed:0},keyboard:{x:4,y:4},messages:{main:'準備中',research:'研究項目を選択',weapons:'工房の仕事を選択'}};
    const deposits = [{x:0,y:1,job:false},{x:0,y:4,job:false},{x:2,y:0,job:false}];
    const structures = [{id:1,x:6,y:2,type:'well',level:1},{id:2,x:3,y:3,type:'archer',level:1},{id:3,x:5,y:4,type:'wall',level:1},{id:4,x:5,y:5,type:'wall',level:1}];
    
    // Lv1 combat test is ephemeral: no save-file changes, rewards or permanent destruction.
    const raid={phase:'ready',time:0,next:0,plan:[],enemies:[],shots:[],hp:{},timers:{},used:new Set(),id:1};
    const RAID_STATS={soldier:{name:'兵士',hp:68,speed:1.12,dmg:11,range:.75,cd:1.1},
      archer:{name:'弓兵',hp:44,speed:.98,dmg:8,range:3.15,cd:1.55}};
    const RAID_MAX={well:150,wall:90,archer:95,mage:75,trap:1};
    const raidLive=()=>raid.phase==='active';
    const raidHP=s=>raid.hp[s.id]??RAID_MAX[s.type]??1;
    const raidOK=s=>s&&raidHP(s)>0;
    const raidCore=()=>structures.find(s=>s.type==='well');
    const raidDist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
    function updateRaidButton(){
      const b=q('[data-raid]');b.textContent=raidLive()?'防衛中':raid.phase==='ready'?'模擬襲撃':'再戦する';
      b.disabled=raidLive();
      qa('[data-mode]').forEach(x=>{x.disabled=raidLive();});
    }
    function raidFinish(value){
      if(!raidLive())return;
      raid.phase=value;updateRaidButton();
      status(value==='win'?'防衛成功（報酬なし）':'中枢陥落（報酬なし）');draw();
    }
    function beginRaid(){
      if(raidLive())return;
      raid.phase='active';raid.time=0;raid.next=0;raid.enemies=[];raid.shots=[];raid.hp={};raid.timers={};raid.used=new Set();raid.id=1;
      structures.forEach(s=>raid.hp[s.id]=RAID_MAX[s.type]??1);
      // Pick two random invasion sides only on start; no fixed entrance shown beforehand.
      const side=Math.floor(Math.random()*4),other=(side+1+Math.floor(Math.random()*3))%4;
      raid.plan=[{at:0,type:'soldier',side},{at:1.8,type:'archer',side},
        {at:4,type:'soldier',side:other},{at:5.6,type:'archer',side:other}];
      state.mode='inspect';state.preview=null;updateMode();updateRaidButton();draw();
    }
    function spawnRaider(order){
      const edge=[];const n=order.side<2?8:10;
      for(let i=0;i<n;i++){
        const p=order.side===0?{x:0,y:i}:order.side===1?{x:9,y:i}:
          order.side===2?{x:i,y:0}:{x:i,y:7};
        if(!structures.some(s=>s.x===p.x&&s.y===p.y&&s.type==='wall'&&raidOK(s)))edge.push(p);
      }
      const fallback=order.side===0?{x:0,y:3}:order.side===1?{x:9,y:3}:
        order.side===2?{x:4,y:0}:{x:4,y:7};
      const p=edge.length?edge[Math.floor(Math.random()*edge.length)]:fallback,def=RAID_STATS[order.type];

    const spriteImages={};
    const assetState={phase:'loading',loaded:0,failed:[]};
    async function loadSpriteImages(){
      root.dataset.assets='loading';
      mapButton.setAttribute('aria-busy','true');
      const required=['floor','archer','well','wall','deposit','kobold'];
      const entries=Object.entries(SPRITE_DATA);
      const results=await Promise.allSettled(entries.map(async([key,meta])=>{
        const img=new Image();img.decoding='async';
        await new Promise((resolve,reject)=>{
          img.onload=resolve;img.onerror=()=>reject(new Error('Sprite could not be loaded: '+key));
          img.src=meta.src;
          if(img.complete&&img.naturalWidth>0)resolve();
        });
        if(typeof img.decode==='function')await img.decode();
        if(!(img.naturalWidth||img.width))throw new Error('Empty sprite: '+key);
        spriteImages[key]=img;
      }));
      assetState.failed=results.flatMap((result,index)=>result.status==='rejected'?[entries[index][0]]:[]);
      required.forEach(key=>{if(!SPRITE_DATA[key]&&!assetState.failed.includes(key))assetState.failed.push(key);});
      assetState.loaded=Object.keys(spriteImages).length;
      assetState.phase=assetState.failed.length?'partial':'ready';
      root.dataset.assets=assetState.phase;
      mapButton.setAttribute('aria-busy','false');
      if(state.messages.main==='準備中'||state.messages.main==='外観を読み込み中')status(assetState.failed.length?'一部の外観を簡易表示':'準備中');
      resize();
      return assetState;
    }

    function facilityName(item){return names[item.type]+(item.type==='well'?'':' Lv'+item.level);}
    function formatCost(cost){return ['materials','mana','funds'].filter(key=>cost?.[key]).map(key=>resourceNames[key]+' '+cost[key]).join(' ＋ ');}
    function canAfford(cost){
      return !!cost&&Object.entries(cost).every(([key,value])=>Object.hasOwn(state.resources,key)&&Number.isFinite(value)&&value>=0&&state.resources[key]>=value);
    }
    function spendCost(cost,now=Date.now()){
      if(!validTimestamp(now))return false;
      settleMana(now);
      // Check every balance before changing any of them.
      if(!canAfford(cost))return false;
      for(const [key,value] of Object.entries(cost))state.resources[key]-=value;
      return true;
    }
    function manaHourlyRate(research=state.research){return Math.round(CONFIG.baseManaHourly*(1+CONFIG.researchBonus*research.extraction)*10)/10;}
    function manaCapacity(research=state.research){return Math.round(CONFIG.baseManaCap*(1+CONFIG.researchBonus*research.storage));}
    function validTimestamp(value){return Number.isSafeInteger(value)&&value>=0&&value<=8640000000000000;}
    function settleMana(now=Date.now()){
      if(!validTimestamp(now)||now<=state.manaUpdatedAt)return 0;
      const before=state.resources.mana;
      const elapsedHours=(now-state.manaUpdatedAt)/3600000;
      state.resources.mana=Math.min(manaCapacity(),before+manaHourlyRate()*elapsedHours);
      // Advance even at the cap. Never move this watermark backwards.
      state.manaUpdatedAt=now;
      return Math.max(0,state.resources.mana-before);
    }
    function getLocalStorage(){try{return window.localStorage||null;}catch{return null;}}
    function createSnapshot(){
      return {version:SAVE_VERSION,savedAt:state.manaUpdatedAt,dungeonLevel:state.dungeonLevel,
        resources:{...state.resources},research:{...state.research},
        structures:structures.map(({id,x,y,type,level})=>({id,x,y,type,level})),
        mining:{active:state.mining.active?{...state.mining.active}:null,queue:[...state.mining.queue],completed:state.mining.completed}};
    }
    function validateSnapshot(raw){
      try{
        if(typeof raw==='string'&&raw.length>65536)return null;
        const data=typeof raw==='string'?JSON.parse(raw):raw;
        const record=value=>value!==null&&typeof value==='object'&&!Array.isArray(value);
        const count=value=>Number.isSafeInteger(value)&&value>=0&&value<=Number.MAX_SAFE_INTEGER-1000;
        if(!record(data)||data.version!==SAVE_VERSION||data.dungeonLevel!==CONFIG.dungeonLevel||!validTimestamp(data.savedAt))return null;
        if(!record(data.research)||![0,1].includes(data.research.extraction)||![0,1].includes(data.research.storage))return null;
        const research={extraction:data.research.extraction,storage:data.research.storage};
        const r=data.resources;
        if(!record(r)||!Number.isFinite(r.mana)||r.mana<0||r.mana>manaCapacity(research)+1e-8||!count(r.materials)||!count(r.funds))return null;
        if(!Array.isArray(data.structures)||data.structures.length<1||data.structures.length>80)return null;
        const ids=new Set(),cells=new Set(),restoredStructures=[];
        let wells=0;
        for(const item of data.structures){
          if(!record(item)||!count(item.id)||item.id<1||ids.has(item.id)||!Object.hasOwn(names,item.type))return null;
          if(!Number.isInteger(item.x)||item.x<0||item.x>=10||!Number.isInteger(item.y)||item.y<0||item.y>=8)return null;
          if(item.type==='well'?item.level!==1:![1,2].includes(item.level))return null;
          const cell=item.x+','+item.y;
          if(cells.has(cell)||deposits.some(d=>d.x===item.x&&d.y===item.y))return null;
          ids.add(item.id);cells.add(cell);if(item.type==='well')wells++;
          restoredStructures.push({id:item.id,x:item.x,y:item.y,type:item.type,level:item.level});
        }
        if(wells!==1)return null;
        const m=data.mining,indexValid=index=>Number.isInteger(index)&&index>=0&&index<deposits.length;
        if(!record(m)||!Array.isArray(m.queue)||m.queue.length>deposits.length||!count(m.completed))return null;
        if(!m.queue.every(indexValid)||new Set(m.queue).size!==m.queue.length)return null;
        let active=null;
        if(m.active!==null){
          if(!record(m.active)||!indexValid(m.active.index)||!Number.isFinite(m.active.remaining)||m.active.remaining<=0||m.active.remaining>CONFIG.miningSeconds||m.queue.includes(m.active.index))return null;
          active={index:m.active.index,remaining:m.active.remaining};
        }
        return {version:SAVE_VERSION,savedAt:data.savedAt,dungeonLevel:data.dungeonLevel,
          resources:{mana:Math.min(r.mana,manaCapacity(research)),materials:r.materials,funds:r.funds},research,
          structures:restoredStructures,mining:{active,queue:[...m.queue],completed:m.completed}};
      }catch{return null;}
    }
    function restoreSnapshot(raw,now=Date.now()){
      const saved=validateSnapshot(raw);
      if(!saved||!validTimestamp(now))return false;
      // Validate the complete snapshot before changing any live state.
      state.dungeonLevel=saved.dungeonLevel;
      state.resources={...saved.resources};state.research={...saved.research};
      structures.splice(0,structures.length,...saved.structures);
      state.nextStructureId=Math.max(...structures.map(item=>item.id))+1;
      state.mining={active:saved.mining.active?{...saved.mining.active}:null,queue:[...saved.mining.queue],completed:saved.mining.completed};
      deposits.forEach((deposit,index)=>{deposit.job=state.mining.active?.index===index||state.mining.queue.includes(index);});
      state.infoTarget=null;state.infoSource=null;state.preview=null;
      state.manaUpdatedAt=saved.savedAt;
      startNextMining();settleMana(now);
      lastMiningTick=performance.now();lastSaveTick=lastMiningTick;
      return true;
    }
    function saveState(now=Date.now(),storage=getLocalStorage()){
      if(!validTimestamp(now))return false;
      settleMana(now);
      try{
        if(!storage||typeof storage.setItem!=='function')return false;
        storage.setItem(STORAGE_KEY,JSON.stringify(createSnapshot()));
        return true;
      }catch{return false;}
    }
    function loadState(now=Date.now(),storage=getLocalStorage()){
      try{
        if(!storage||typeof storage.getItem!=='function')return false;
        const raw=storage.getItem(STORAGE_KEY);
        if(raw===null||!restoreSnapshot(raw,now))return false;
        saveState(now,storage);return true;
      }catch{return false;}
    }
    function startNextMining(){
      while(!state.mining.active&&state.mining.queue.length){
        const index=state.mining.queue.shift();
        if(deposits[index]?.job)state.mining.active={index,remaining:CONFIG.miningSeconds};
      }
    }
    function advanceEconomy(seconds){
      // Mining uses visible elapsed time only. Mana is settled separately by wall clock.
      const result={manaGained:0,materialsGained:0,completed:0};
      if(document.hidden||!Number.isFinite(seconds)||seconds<=0)return result;
      let remaining=seconds;
      startNextMining();
      while(remaining>0&&state.mining.active){
        const job=state.mining.active;
        const step=Math.min(remaining,job.remaining);
        job.remaining-=step;remaining-=step;
        if(job.remaining>1e-9)break;
        deposits[job.index].job=false;
        state.resources.materials+=CONFIG.miningYield;
        state.mining.completed++;result.completed++;
        result.materialsGained+=CONFIG.miningYield;
        state.mining.active=null;
        startNextMining();
      }
      refreshResources();
      if(result.completed)status('採掘完了：資材 ＋'+result.materialsGained);
      draw();
      return result;
    }
    function tickEconomy(now=Date.now(),monotonicNow=performance.now()){
      const manaGained=settleMana(now);
      let result={manaGained:0,materialsGained:0,completed:0};
      if(Number.isFinite(monotonicNow)){
        const seconds=Math.max(0,(monotonicNow-lastMiningTick)/1000);
        lastMiningTick=Math.max(lastMiningTick,monotonicNow);
        result=advanceEconomy(Math.min(seconds,1));
        if(result.completed||monotonicNow-lastSaveTick>=5000){saveState(now);lastSaveTick=monotonicNow;}
      }
      refreshResources();
      return {...result,manaGained};
    }
    function handleVisibilityChange(now=Date.now(),monotonicNow=performance.now()){
      if(root.isConnected===false)return;
      lastRaidTick=performance.now();
      if(Number.isFinite(monotonicNow)){lastMiningTick=monotonicNow;lastSaveTick=monotonicNow;}
      saveState(now);refreshResources();
      if(!document.hidden)draw();
    }

    function resize(){const r=wrap.getBoundingClientRect();if(!r.width)return;width=r.width;height=r.height;const dpr=Math.min(window.devicePixelRatio||1,2);canvas.width=Math.round(width*dpr);canvas.height=Math.round(height*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);readColors();draw();}
    const status = (text,screen='main') => {state.messages[screen]=text;if(state.screen===screen)q('[data-status]').textContent=text;};
    function setScreen(name){clearInspection();const focusButton=name==='main'?q('[data-go="'+state.screen+'"]'):q('[data-screen="'+name+'"]').querySelector('[data-go="main"]');state.screen=name;qa('[data-screen]').forEach(el=>{el.hidden=el.dataset.screen!==name;});q('[data-status]').textContent=state.messages[name];requestAnimationFrame(()=>{if(name==='main')resize();focusButton?.focus({preventScroll:true});});}
    function refreshResources(){
      q('[data-mana]').textContent=Math.floor(state.resources.mana)+'/'+manaCapacity();
      q('[data-materials]').textContent=state.resources.materials;
      q('[data-funds]').textContent=state.resources.funds;
      updateBuildControls();updateUpgradePanel();updateResearchControls();
    }
    function updateMode(){
      clearInspection();
      qa('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));
      q('[data-buildbar]').hidden=state.mode!=='build';
      q('[data-mode="build"]').textContent=state.mode==='build'?'配置終了':'施設配置';
      q('[data-mode="mine"]').textContent=state.mode==='mine'?'掘削終了':'掘削';
      updateBuildControls();
      draw();
    }
    function validCell(x,y){return x>=0&&x<10&&y>=0&&y<8&&!structures.some(s=>s.x===x&&s.y===y)&&!deposits.some(d=>d.x===x&&d.y===y);}
    function previewCell(x,y){state.keyboard={x,y};if(validCell(x,y)){state.preview={x,y};status('配置位置を確認');}else{state.preview=null;status('空いているマスを選択');}updateBuildControls();draw();}
    function markDeposit(index,now=Date.now()){
      if(!Number.isInteger(index)||!deposits[index]||!validTimestamp(now))return false;
      const previousActive=state.mining.active?.index;
      const deposit=deposits[index];state.mineIndex=index;
      if(deposit.job){
        deposit.job=false;
        state.mining.queue=state.mining.queue.filter(i=>i!==index);
        if(state.mining.active?.index===index)state.mining.active=null;
        startNextMining();status('掘削指示を取り消しました');
      }else{
        deposit.job=true;state.mining.queue.push(index);startNextMining();
        status('コボルドが順番に掘削します');
      }
      if(previousActive!==state.mining.active?.index)lastMiningTick=performance.now();
      saveState(now);refreshResources();draw();return true;
    }
    function mapAction(clientX,clientY,pointerType='mouse'){if(raidLive())return;const r=mapButton.getBoundingClientRect();const px=clientX-r.left,py=clientY-r.top;const ax=(px-ox)/tw,ay=(py-oy)/th;const x=Math.round((ax+ay)/2),y=Math.round((ay-ax)/2);
      if(state.mode==='build')previewCell(x,y);
      else if(state.mode==='mine'){const deposit=hitRegionList(miningHitRegions,px,py,pointerType==='touch'),index=deposits.indexOf(deposit);if(index>=0)markDeposit(index);else status('鉱床を選んで掘削を指定');}
      else inspectPointer(clientX,clientY,'tap',pointerType==='touch');
    }
    qa('[data-go]').forEach(b=>b.addEventListener('click',()=>{if(!raidLive())setScreen(b.dataset.go);}));
    q('[data-raid]').addEventListener('click',beginRaid);
    qa('[data-mode]').forEach(b=>b.addEventListener('click',()=>{if(raidLive())return;state.mode=state.mode===b.dataset.mode?'inspect':b.dataset.mode;state.preview=null;status(state.mode==='mine'?'鉱床を選んで掘削を指定':state.mode==='build'?'空きマスを選んで配置':'準備中');updateMode();}));
    qa('[data-kind]').forEach(b=>b.addEventListener('click',()=>{if(!COSTS.build[b.dataset.kind])return;state.kind=b.dataset.kind;qa('[data-kind]').forEach(k=>k.setAttribute('aria-pressed',String(k===b)));updateBuildControls();draw();}));
    q('[data-cancel]').addEventListener('click',()=>{state.preview=null;updateBuildControls();status('空きマスを選択');draw();});
    q('[data-confirm]').addEventListener('click',()=>buildSelected());
    q('[data-upgrade]').addEventListener('click',()=>upgradeSelected());
    q('[data-well-research]').addEventListener('click',()=>{if(state.infoTarget?.type==='well')setScreen('research');});
    q('[data-clear-selection]').addEventListener('click',()=>{clearInspection(true);mapButton.focus({preventScroll:true});});
    q('[data-upgrade-panel]').addEventListener('keydown',e=>{if(e.key==='Escape'){e.preventDefault();clearInspection(true);mapButton.focus({preventScroll:true});}});
    qa('[data-research]').forEach(button=>button.addEventListener('click',()=>completeResearch(button.dataset.research)));
    qa('[data-work]').forEach(b=>b.addEventListener('click',()=>{state.work=b.dataset.work;qa('[data-work]').forEach(k=>k.setAttribute('aria-pressed',String(k===b)));const up=state.work==='upgrade';q('[data-item-name="sword"]').textContent=up?'鉄の剣 I → II':'鉄の剣';q('[data-item-name="armor"]').textContent=up?'鉄の鎧 I → II':'鉄の鎧';q('[data-item-detail="sword"]').textContent=up?'既存の武器を強化する。':'配下の近接攻撃用。';q('[data-item-detail="armor"]').textContent=up?'既存の防具を強化する。':'前衛の防御用。';qa('[data-weapon]').forEach(k=>k.textContent=up?'改良を指示':'製造を指示');}));
    qa('[data-weapon]').forEach(b=>b.addEventListener('click',()=>{state.orders++;status(b.dataset.weapon+'の'+(state.work==='upgrade'?'改良':'製造')+'を予約 ／ 工房 '+state.orders+'件','weapons');}));
    let start=null;const pointers=new Map();let pinch=null,hoverResume=null;
    mapButton.addEventListener('pointerdown',e=>{
      if(e.pointerType==='mouse'&&e.button>0)return;
      clearInspection(true);
      mapButton.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===1)start={id:e.pointerId,x:e.clientX,y:e.clientY,panX:state.panX,panY:state.panY,moved:false};
      else{
        if(start)start.moved=true;
        if(pointers.size===2){const a=[...pointers.values()];pinch={distance:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),zoom:state.zoom};}
      }
    });
    mapButton.addEventListener('pointermove',e=>{
      if(!pointers.has(e.pointerId)){
        if(pointers.size||state.mode!=='inspect'||state.screen!=='main'||e.pointerType==='touch'||e.buttons)return;
        if(hoverResume&&Math.hypot(e.clientX-hoverResume.x,e.clientY-hoverResume.y)<4)return;
        hoverResume=null;
        inspectPointer(e.clientX,e.clientY,'hover');
        return;
      }
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size>=2&&pinch){
        const a=[...pointers.values()];
        state.zoom=Math.max(.8,Math.min(1.8,pinch.zoom*Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)/Math.max(1,pinch.distance)));
        if(start)start.moved=true;
        draw();return;
      }
      if(pinch)return;
      if(start){
        const dx=e.clientX-start.x,dy=e.clientY-start.y;
        if(Math.hypot(dx,dy)>7)start.moved=true;
        if(start.moved){state.panX=start.panX+dx;state.panY=start.panY+dy;draw();}
      }
    });
    mapButton.addEventListener('pointerup',e=>{
      if(!pointers.has(e.pointerId))return;
      const travel=start?Math.hypot(e.clientX-start.x,e.clientY-start.y):Infinity;
      const act=pointers.size===1&&start&&start.id===e.pointerId&&!start.moved&&!pinch&&travel<=7;
      const wasGesture=start?.moved||pinch||travel>7;
      pointers.delete(e.pointerId);
      if(act)mapAction(e.clientX,e.clientY,e.pointerType);
      if(!pointers.size){
        if(wasGesture)hoverResume={x:e.clientX,y:e.clientY};
        start=null;pinch=null;
      }
    });
    mapButton.addEventListener('pointercancel',e=>{
      pointers.delete(e.pointerId);clearInspection(true);
      hoverResume={x:e.clientX,y:e.clientY};
      if(!pointers.size){start=null;pinch=null;}else if(start)start.moved=true;
    });
    mapButton.addEventListener('pointerleave',e=>{if(e.pointerType!=='touch'&&!pointers.size&&state.infoSource==='hover')clearInspection(true);});
    mapButton.addEventListener('blur',()=>{if(state.infoSource==='hover')clearInspection(true);});
    mapButton.addEventListener('click',e=>e.preventDefault());
    mapButton.addEventListener('wheel',e=>{e.preventDefault();clearInspection();hoverResume={x:e.clientX,y:e.clientY};state.zoom=Math.max(.8,Math.min(1.8,state.zoom-e.deltaY*.001));draw();},{passive:false});
    mapButton.addEventListener('keydown',e=>{
      if(e.key==='Escape'&&state.mode==='inspect'){e.preventDefault();clearInspection(true);return;}
      if(!['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Enter',' '].includes(e.key))return;
      e.preventDefault();
      if(state.mode==='build'){
        let{x,y}=state.keyboard;
        if(e.key==='ArrowLeft')x--;if(e.key==='ArrowRight')x++;if(e.key==='ArrowUp')y--;if(e.key==='ArrowDown')y++;
        previewCell(Math.max(0,Math.min(9,x)),Math.max(0,Math.min(7,y)));
      }else if(state.mode==='mine'){
        if(e.key==='Enter'||e.key===' ')markDeposit(state.mineIndex);
        else{state.mineIndex=(state.mineIndex+(e.key==='ArrowLeft'||e.key==='ArrowUp'?-1:1)+deposits.length)%deposits.length;status('鉱床 '+(state.mineIndex+1)+' を選択。Enterで掘削指定');}
      }else if(e.key==='Enter'||e.key===' ')cycleInspection(e.shiftKey);
      else{
        clearInspection();
        if(e.key==='ArrowLeft')state.panX+=20;if(e.key==='ArrowRight')state.panX-=20;if(e.key==='ArrowUp')state.panY+=20;if(e.key==='ArrowDown')state.panY-=20;
        draw();
      }
    });
    new ResizeObserver(resize).observe(wrap);
    const mq=window.matchMedia('(prefers-color-scheme: dark)');mq.addEventListener?.('change',()=>{readColors();draw();});
    const themeObserver=new MutationObserver(()=>{readColors();draw();});themeObserver.observe(document.documentElement,{attributes:true,attributeFilter:['class','style','data-theme']});
    const bootNow=Date.now();
    if(!loadState(bootNow))saveState(bootNow);
    status('外観を読み込み中');refreshResources();updateRaidButton();resize();
    const assetReadyPromise=loadSpriteImages();
    let lastRaidTick=performance.now();
    const economyTimer=window.setInterval(()=>{
      if(root.isConnected===false){window.clearInterval(economyTimer);return;}
      tickEconomy();
      const raidNow=performance.now();advanceRaid(Math.max(0,(raidNow-lastRaidTick)/1000));lastRaidTick=raidNow;
    },250);
    document.addEventListener('visibilitychange',()=>handleVisibilityChange());
    window.addEventListener('focus',()=>handleVisibilityChange());
    window.addEventListener('pagehide',()=>{if(root.isConnected!==false)saveState();});
  })();
  </script>
</div>
